<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Demo WhatsApp → Resi — AI Asisten</title>
<style>
  :root { --cream:#f7f3ec; --ink:#17150f; --accent:#ea580c; }
  * { box-sizing: border-box; }
  body { margin: 0; background: radial-gradient(800px 500px at 10% 0%, #ffe6d2, transparent 60%), var(--cream); color: var(--ink); font-family: Inter, system-ui, sans-serif; min-height: 100vh; display: grid; place-items: center; padding: 28px; }
  .wrap { width: min(920px, 100%); }
  h1 { font-family: Fraunces, Georgia, serif; font-size: clamp(28px, 5vw, 44px); margin: 0 0 6px; letter-spacing: -.02em; }
  p { margin: 0 0 20px; color: #55504a; }
  video { width: 100%; max-height: 78vh; border-radius: 16px; box-shadow: 0 24px 60px rgba(23,21,15,.18); background: #000; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-top: 18px; }
  a.btn, button { display: inline-flex; align-items: center; gap: 8px; padding: 12px 20px; border-radius: 10px; border: 1px solid #e2d9cb; background: #fff; color: var(--ink); text-decoration: none; font-weight: 600; cursor: pointer; }
  a.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .meta { font-size: 13px; color: #7a736a; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Demo: WhatsApp → resi & link tracking</h1>
  <p>Alur nyata AI penjaga toko: cek stok Accurate → ongkir Biteship → QRIS → resi otomatis.</p>
  <video id="v" controls playsinline preload="metadata" poster="">
    <source src="/demo/wa-demo.mp4" type="video/mp4" />
    Browser Anda tidak mendukung video HTML5.
  </video>
  <div class="row">
    <a class="btn primary" href="/demo/wa-demo.mp4" download>⬇ Unduh MP4 (1080×1920)</a>
    <a class="btn" href="/whatsapp">Buka WhatsApp</a>
    <span class="meta">43 detik · 1080×1920 · H.264</span>
  </div>
</div>
</body>
</html>
