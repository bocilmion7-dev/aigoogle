    </script>
    <script>
      (function () {
        var KEY = "aigoogle:asset-recover";
        var reloading = false;
        function reload() {
          if (reloading) return;
          reloading = true;
          var u = new URL(location.href);
          u.searchParams.set("_r", Date.now().toString(36));
          location.replace(u.toString());
        }
        window.addEventListener(
          "error",
          function (e) {
            var t = e.target;
            if (!t || (t.tagName !== "SCRIPT" && t.tagName !== "LINK")) return;
            if (t.tagName === "LINK") {
              var rel = (t.getAttribute("rel") || "").toLowerCase();
              if (rel !== "stylesheet" && rel !== "modulepreload") return;
            }
            try {
              var last = Number(sessionStorage.getItem(KEY) || 0);
              if (Date.now() - last < 60000) return;
              sessionStorage.setItem(KEY, String(Date.now()));
            } catch (_) {}
            var timer = setTimeout(reload, 1200);
            try {
              if ("serviceWorker" in navigator) {
                navigator.serviceWorker
                  .getRegistrations()
                  .then(function (rs) {
                    return Promise.all(
                      rs.map(function (r) {
                        return r.unregister();
                      })
                    );
                  })
                  .then(function () {
                    clearTimeout(timer);
                    reload();
                  })
                  .catch(function () {
                    clearTimeout(timer);
                    reload();
                  });
                return;
              }
            } catch (_) {}
            clearTimeout(timer);
            reload();
          },
          true
        );
      })();
    </script>
